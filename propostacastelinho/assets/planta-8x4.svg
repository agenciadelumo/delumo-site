<svg class="plan" viewBox="0 0 980 650" role="img" aria-labelledby="plan-title plan-desc"><title id="plan-title">Planta do estande: 8 metros de largura por 4 metros de profundidade</title><desc id="plan-desc">Duas projeções de 3 metros no fundo, separadas por 1 metro e com 50 centímetros em cada extremidade. Uma projeção de 3 metros em cada lateral. Todas têm 2 metros de altura. Divisória central avança 1 metro desde o fundo. Atendimento à esquerda e atividade à direita da entrada. Quatro grupos de cinco e entrada frontal de 2 metros.</desc><defs><pattern id="floorgrid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#325541" stroke-width="1"/></pattern><g id="person"><circle r="12" fill="#f4f1e8"/><path d="M-8 17H8" stroke="#f4f1e8" stroke-width="4" stroke-linecap="round"/></g><g id="leader"><circle r="12" fill="#b4f428"/><rect x="-13" y="16" width="26" height="10" rx="5" fill="#b4f428"/><path d="M-7 18V24M-10 21H-4" stroke="#0c1f14" stroke-width="2"/></g><g id="projector"><rect x="-21" y="-13" width="42" height="26" rx="5" fill="#e7eee2"/><circle cx="9" r="7" fill="#0c1f14"/><path d="M-14-5H-6M-14 1H-6M-14 7H-6" stroke="#0c1f14" stroke-width="2"/></g></defs><rect x="90" y="110" width="800" height="400" fill="url(#floorgrid)" stroke="#6f8b77" stroke-width="8"/><path d="M140 110H440M540 110H840M90 160V460M890 160V460" stroke="#b4f428" stroke-width="10"/><path d="M390 510H590" stroke="#132a1b" stroke-width="14"/><path d="M490 110V210" stroke="#dbae7f" stroke-width="12"/><g stroke="#71917c" fill="none"><path d="M90 42V57M90 50H890M890 42V57M440 66H540M440 60V72M540 60V72"/></g><g fill="#f4f1e8" font-family="Figtree,sans-serif" font-size="20" text-anchor="middle"><text x="490" y="29">8 m · largura</text><text x="290" y="85">P1 · 3 m × 2 m</text><text x="690" y="85">P2 · 3 m × 2 m</text><text x="490" y="85" font-size="15">1 m</text><text x="112" y="85" font-size="12">0,5 m</text><text x="866" y="85" font-size="12">0,5 m</text><text transform="translate(48 315) rotate(-90)">P3 · 3 m × 2 m</text><text transform="translate(932 315) rotate(90)">P4 · 3 m × 2 m</text><text x="490" y="550">Entrada · 2 m livres</text><text x="490" y="578" font-size="16">Frente cenográfica · porta com 2,5 m de altura</text><text x="490" y="625" font-size="16">Profundidade: 4 m · todas as projeções com 2 m de altura</text></g><g opacity=".12" fill="#b4f428"><path d="M290 285L140 115H440ZM690 285L540 115H840ZM350 360L95 160V460ZM630 360L885 160V460Z"/></g><use href="#projector" transform="translate(290 285) rotate(-90)"/><use href="#projector" transform="translate(690 285) rotate(-90)"/><use href="#projector" transform="translate(350 360) rotate(180)"/><use href="#projector" transform="translate(630 360)"/><use href="#leader" x="290" y="153"/><use href="#person" x="215" y="202"/><use href="#person" x="265" y="222"/><use href="#person" x="315" y="222"/><use href="#person" x="365" y="202"/><use href="#leader" x="690" y="153"/><use href="#person" x="615" y="202"/><use href="#person" x="665" y="222"/><use href="#person" x="715" y="222"/><use href="#person" x="765" y="202"/><use href="#leader" transform="translate(153 355) rotate(-90)"/><use href="#person" x="210" y="320"/><use href="#person" x="263" y="335"/><use href="#person" x="210" y="400"/><use href="#person" x="263" y="415"/><use href="#leader" transform="translate(827 355) rotate(90)"/><use href="#person" x="770" y="320"/><use href="#person" x="717" y="335"/><use href="#person" x="770" y="400"/><use href="#person" x="717" y="415"/><g fill="#dbae7f" font-size="15" font-family="Figtree,sans-serif" text-anchor="middle"><text x="490" y="244">Divisória · avanço 1 m</text><text x="490" y="265">Foto da Prefeitura</text></g><rect x="235" y="465" width="130" height="35" rx="5" fill="#2d5138"/><rect x="615" y="465" width="130" height="35" rx="5" fill="#2d5138"/><g fill="#f4f1e8" font-family="Figtree,sans-serif" font-size="17" text-anchor="middle"><text x="300" y="48