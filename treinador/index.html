<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6b57" />
    <meta name="description" content="TreinaGente — conhecimento que prepara pessoas. Plataforma brasileira para criar treinamentos corporativos com inteligência artificial." />
    <title>TreinaGente | Treinador Delumo</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f5f8f5; }
      .loading { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; background: #f5f8f5; transition: opacity .25s ease, visibility .25s ease; }
      .loading.hidden { opacity: 0; visibility: hidden; }
      .loading-card { display: grid; justify-items: center; gap: 13px; color: #173b35; text-align: center; }
      .mark { width: 58px; height: 58px; padding: 8px; border-radius: 18px; background: #e8f4ef; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(11,107,87,.08); }
      .mark svg { width: 100%; height: 100%; }
      .loading strong { font-size: 18px; letter-spacing: -.4px; }
      .loading span { color: #747d91; font-size: 12px; }
      .bar { width: 160px; height: 4px; overflow: hidden; border-radius: 999px; background: #e4e5ee; }
      .bar::after { content: ""; display: block; width: 55%; height: 100%; border-radius: inherit; background: #0b6b57; animation: load 1.1s ease-in-out infinite alternate; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f5f8f5; }
      .fallback { position: fixed; z-index: 2; inset: auto 16px 16px; display: none; padding: 12px; border-radius: 10px; background: #173b35; color: white; text-align: center; font-size: 12px; }
      .fallback a { color: #f6c445; font-weight: 700; }
      @keyframes load { from { transform: translateX(-42%); } to { transform: translateX(82%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div class="loading" id="loading" role="status" aria-live="polite">
      <div class="loading-card"><div class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M49 16A23 23 0 1 0 52 43V33H36" fill="none" stroke="#0B6B57" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="24" r="5" fill="#F6C445"/><path d="M18 45c4-9 10-14 16-14 5 0 9 3 13 8" fill="none" stroke="#167D7F" stroke-width="7" stroke-linecap="round"/></svg></div><strong>Preparando a TreinaGente</strong><span>Conhecimento que prepara pessoas.</span><div class="bar"></div></div>
    </div>
    <iframe
      id="trainer"
      src="https://treinador-ecru.vercel.app/"
      title="TreinaGente — Estúdio de treinamentos corporativos"
      allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"
      allowfullscreen
    ></iframe>
    <div class="fallback" id="fallback">Não foi possível abrir o estúdio nesta página. <a href="https://treinador-ecru.vercel.app/" target="_blank" rel="noopener">Abrir a TreinaGente em uma nova guia</a>.</div>
    <script>
      const frame = document.getElementById('trainer');
      const loading = document.getElementById('loading');
      const fallback = document.getElementById('fallback');
      let loaded = false;
      frame.addEventListener('load', () => { loaded = true; loading.classList.add('hidden'); });
      window.setTimeout(() => { if (!loaded) { loading.classList.add('hidden'); fallback.style.display = 'block'; } }, 12000);
    </script>
  </body>
</html>
