<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5654f5" />
    <meta name="description" content="Mundo — plataforma brasileira para criar treinamentos corporativos com inteligência artificial." />
    <title>Mundo | Treinador Delumo</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f7f8fc; }
      .loading { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; background: #f7f8fc; transition: opacity .25s ease, visibility .25s ease; }
      .loading.hidden { opacity: 0; visibility: hidden; }
      .loading-card { display: grid; justify-items: center; gap: 13px; color: #17203b; text-align: center; }
      .mark { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(145deg, #7978ff, #4947e8); color: white; display: grid; place-items: center; box-shadow: 0 12px 28px rgba(86,84,245,.28); font-size: 24px; font-weight: 800; }
      .loading strong { font-size: 18px; letter-spacing: -.4px; }
      .loading span { color: #747d91; font-size: 12px; }
      .bar { width: 160px; height: 4px; overflow: hidden; border-radius: 999px; background: #e4e5ee; }
      .bar::after { content: ""; display: block; width: 55%; height: 100%; border-radius: inherit; background: #5654f5; animation: load 1.1s ease-in-out infinite alternate; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f7f8fc; }
      .fallback { position: fixed; z-index: 2; inset: auto 16px 16px; display: none; padding: 12px; border-radius: 10px; background: #17203b; color: white; text-align: center; font-size: 12px; }
      .fallback a { color: #c9c8ff; font-weight: 700; }
      @keyframes load { from { transform: translateX(-42%); } to { transform: translateX(82%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div class="loading" id="loading" role="status" aria-live="polite">
      <div class="loading-card"><div class="mark">M</div><strong>Preparando a Mundo</strong><span>Seu estúdio de treinamentos está carregando.</span><div class="bar"></div></div>
    </div>
    <iframe
      id="trainer"
      src="https://treinador-ecru.vercel.app/"
      title="Mundo — Estúdio de treinamentos corporativos"
      allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"
      allowfullscreen
    ></iframe>
    <div class="fallback" id="fallback">Não foi possível abrir o estúdio nesta página. <a href="https://treinador-ecru.vercel.app/" target="_blank" rel="noopener">Abrir a Mundo em uma nova guia</a>.</div>
    <script>
      const frame = document.getElementById('trainer');
      const loading = document.getElementById('loading');
      const fallback = document.getElementById('fallback');
      let loaded = false;
      frame.addEventListener('load', () => { loaded = true; loading.classList.add('hidden'); });
      window.setTimeout(() => { if (!loaded) { loading.classList.add('hidden'); fallback.style.display = 'block'; } }, 12000);
    </script>
  </body>
</html>
